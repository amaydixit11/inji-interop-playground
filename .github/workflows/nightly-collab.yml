# Nightly conformance audit of the public MOSIP Collab sandbox.
#
# Collab is a real deployment that nobody here configured, which is what makes it
# worth watching: a finding that reproduces there is a property of the software
# rather than of one local setup. It needs no credentials, so this runs without
# secrets.
#
# Discovery only. Collab delegates authorization to eSignet and exposes no
# working pre-authorized code grant, so issuance cannot complete without a person
# logging in — and a metadata audit that reported itself as a failed run because
# it never issued anything would be measuring the wrong thing.
name: Nightly Collab audit

on:
  schedule:
    # 02:00 UTC. Nothing here is time-sensitive; the point is to notice the day
    # a Collab deployment changes.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, because the playground process started below is the one that
    # calls Certify; set only on the audit step, it never reached the server.
    env:
      CERTIFY_BASE_URL: https://injicertify-mock.collab.mosip.net

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Start the playground
        run: |
          node apps/bff/dist/index.js > bff.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8787/api/health; then exit 0; fi
            sleep 2
          done
          echo "BFF did not become healthy"; cat bff.log; exit 1

      # A Collab outage is not a conformance regression, so it is reported as a
      # warning, with curl's own error, and the audit is skipped.
      - name: Check Collab is reachable
        id: reach
        run: |
          if curl -sS --max-time 20 -o /dev/null https://injicertify-mock.collab.mosip.net/v1/certify/.well-known/openid-credential-issuer; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Collab is not reachable from this runner, so the audit was skipped. Run it locally: see README, Running the matrix from CI."
          fi

      - name: Audit Collab Certify metadata
        id: audit
        if: steps.reach.outputs.reachable == 'true'
        # Collab has known open findings, so an absolute pass/fail would be red
        # every night. It is compared against a recorded baseline instead, and
        # fails only when a check that used to pass stops passing.
        run: |
          node scripts/run-matrix.mjs \
            --issuer inji-certify \
            --formats ldp_vc \
            --faults none \
            --stop-after discover \
            --baseline docs/baseline-collab.json \
            --fail-on-regression \
            --out collab-audit.md

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Collab conformance audit'
            echo
            if [ -f collab-audit.md ]; then
              sed -n '/^## Findings/,/^## Conformance/p' collab-audit.md | head -40
            elif [ '${{ steps.reach.outputs.reachable }}' = 'false' ]; then
              echo 'Skipped: Collab was not reachable from this runner.'
            else
              echo 'The audit produced no report — see the logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collab-audit
          path: |
            collab-audit.md
            bff.log
